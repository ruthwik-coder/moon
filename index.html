<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Explorer - Equidistant Cylindrical</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="map"></div>
  <div id="ui-overlay">
    <div id="coordinates">Lat: --, Lon: --</div>
    <div id="zoom-level">Zoom: --</div>
    <div id="layer-info">Layer: Moon</div>
    <div id="crater-count">Craters: 0</div>
    <div id="search-container">
      <input type="text" id="search-input" placeholder="Search craters, maria...">
      <div id="search-results"></div>
    </div>
  </div>
  <div id="loading-overlay">Loading Moon...</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
